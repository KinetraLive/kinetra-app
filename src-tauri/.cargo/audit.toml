# cargo-audit settings (`cargo audit`, run from src-tauri/).

[advisories]
# zip 4.6.1 (extraction: SUID/SGID bits, symlink targets, permissions through symlinks).
# Only in Cargo.lock: tauri-plugin-updater lists zip as a Windows-only dependency behind its
