# cargo-audit settings (`cargo audit`, run from src-tauri/).

[advisories]
# zip 4.6.1 (extraction: SUID/SGID bits, symlink targets, permissions through symlinks).
# Only in Cargo.lock: tauri-plugin-updater lists zip as a Windows-only dependency behind its
# `zip` feature, which Kinetra enables on macOS only, so no build compiles zip
# (`cargo tree -i zip@4.6.1 --target <triple>` prints nothing for Windows and macOS).
# No fixed updater yet: 2.14.0 still requires zip ^4.
# Remove these ignores when tauri-plugin-updater moves past zip 4 (owner, 2026-10-26).
# Newer zip advisories, same reason: RUSTSEC-2026-0429 (extract aborts on a symlink entry with a
# large declared size; 2026-11-10, `cargo tree -i zip@4.6.1` still empty for Windows and macOS).
# The zip GHSAs noted on 2026-10-30 (GHSA-m665-v7pm-7grj, GHSA-q7v9-x93c-xqv3,
# GHSA-8hxf-qr8p-62x4) that still have no RUSTSEC id get it added here, same reason, once it appears
# (docs/RELEASING.md › Supply chain).
ignore = [
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
  "RUSTSEC-2026-0429",
]
