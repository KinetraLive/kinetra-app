<div class="lt">
  <div class="lt__safe">
    <div class="lt__wipe">
      <div class="lt__box">
        <img class="lt__photo" src="{{photo}}" alt="">
        <div class="lt__text">
          <i class="lt__sq" aria-hidden="true"></i>
          <div class="lt__label">{{label}}</div>
          <div class="lt__name" data-fit data-fit-lines="2" data-fit-min="0.5">{{name}}</div>
          <i class="lt__rule" aria-hidden="true"></i>
          <div class="lt__title" data-fit data-fit-lines="2" data-fit-min="0.75">{{title}}</div>
        </div>
        <div class="lt__field"><img class="lt__logo" src="{{logo}}" alt=""></div>
      </div>
    </div>
  </div>
</div>
