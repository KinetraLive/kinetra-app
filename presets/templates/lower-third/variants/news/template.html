<div class="lt">
  <div class="lt__safe">
    <div class="lt__box">
      <div class="lt__tags"><span class="lt__tag">{{label}}</span></div>
      <div class="lt__row">
        <img class="lt__photo" src="{{photo}}" alt="">
        <div class="lt__bars">
          <div class="lt__bar lt__bar--name"><i class="lt__bg"></i><div class="lt__name" data-fit data-fit-lines="2" data-fit-min="0.55">{{name}}</div></div>
          <div class="lt__bar lt__bar--title"><i class="lt__bg"></i><div class="lt__title" data-fit data-fit-lines="2" data-fit-min="0.75">{{title}}</div></div>
        </div>
        <div class="lt__side"><i class="lt__bg"></i><i class="lt__rule"></i><img class="lt__logo" src="{{logo}}" alt=""></div>
      </div>
    </div>
  </div>
</div>
