<div class="lt">
  <div class="lt__safe">
    <div class="lt__box">
      <div class="lt__plate"></div>
      <img class="lt__photo" src="{{photo}}" alt="">
      <div class="lt__text">
        <div class="lt__label">{{label}}</div>
        <div class="lt__name" data-fit data-fit-lines="2" data-fit-min="0.55">{{name}}</div>
        <div class="lt__line">
          <i class="lt__rule lt__rule--l"></i>
          <div class="lt__title" data-fit data-fit-lines="2" data-fit-min="0.75">{{title}}</div>
          <i class="lt__rule lt__rule--r"></i>
        </div>
      </div>
      <img class="lt__logo" src="{{logo}}" alt="">
    </div>
  </div>
</div>
