<div class="lt">
  <div class="lt__safe">
    <div class="lt__box">
      <div class="lt__plate"></div>
      <img class="lt__photo" src="{{photo}}" alt="">
      <div class="lt__label">{{label}}</div>
      <div class="lt__text">
        <div class="lt__name" data-fit data-fit-min="0.55">{{name}}</div>
        <div class="lt__title" data-fit data-fit-lines="2" data-fit-min="0.6">{{title}}</div>
      </div>
      <span class="lt__chip"><img class="lt__logo" src="{{logo}}" alt=""></span>
    </div>
  </div>
</div>
