<div class="nn">
  <div class="nn__safe">
    <div class="nn__box">
      <div class="nn__plate"></div>
      <div class="nn__row nn__row--now">
        <div class="nn__tag">{{now_label}}</div>
        <div class="nn__title" data-fit data-fit-min="0.7">{{now_title}}</div>
        <div class="nn__meta">
          <span class="nn__loc">{{now_location}}</span>
          <span class="nn__until">{{now_end}}</span>
        </div>
      </div>
      <div class="nn__row nn__row--next" data-status="{{next_status}}">
        <div class="nn__tag">{{next_label}}</div>
        <div class="nn__title" data-fit data-fit-min="0.7">{{next_title}}</div>
        <div class="nn__meta">
          <span class="nn__loc">{{next_location}}</span>
          <span class="nn__when"><span class="nn__new">{{next_new_start}}</span><span class="nn__at">{{next_start}}</span></span>
          <span class="nn__in">{{next_countdown}}</span>
        </div>
      </div>
    </div>
  </div>
</div>
