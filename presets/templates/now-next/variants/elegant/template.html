<div class="nn">
  <div class="nn__safe">
    <div class="nn__box">
      <div class="nn__plate"></div>
      <div class="nn__col nn__col--now">
        <div class="nn__line"><i class="nn__rule nn__rule--l"></i><span class="nn__tag">{{now_label}}</span><i class="nn__rule nn__rule--r"></i></div>
        <div class="nn__title" data-fit data-fit-lines="2" data-fit-min="0.65">{{now_title}}</div>
        <div class="nn__meta"><span class="nn__loc">{{now_location}}</span><span class="nn__until">{{now_end}}</span></div>
      </div>
      <i class="nn__divider"></i>
      <div class="nn__col nn__col--next" data-status="{{next_status}}">
        <div class="nn__line"><i class="nn__rule nn__rule--l"></i><span class="nn__tag">{{next_label}}</span><i class="nn__rule nn__rule--r"></i></div>
        <div class="nn__title" data-fit data-fit-lines="2" data-fit-min="0.65">{{next_title}}</div>
        <div class="nn__meta"><span class="nn__loc">{{next_location}}</span><span class="nn__when"><span class="nn__new">{{next_new_start}}</span><span class="nn__at">{{next_start}}</span></span><span class="nn__in">{{next_countdown}}</span></div>
      </div>
    </div>
  </div>
</div>
