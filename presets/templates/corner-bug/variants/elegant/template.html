<div class="bug">
  <div class="bug__stage">
    <div class="bug__box">
      <div class="bug__plate"></div>
      <img class="bug__logo" src="{{logo}}" alt="">
      <div class="bug__line">
        <i class="bug__rule bug__rule--l"></i>
        <span class="bug__text" data-fit data-fit-min="0.7">{{text}}</span>
        <i class="bug__rule bug__rule--r"></i>
      </div>
    </div>
  </div>
</div>
