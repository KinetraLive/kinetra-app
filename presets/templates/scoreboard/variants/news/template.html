<div class="sb">
  <div class="sb__stage">
    <div class="sb__box">
      <div class="sb__teams">
        <i class="sb__fill"></i>
        <div class="sb__team sb__team--home">
          <span class="sb__name" data-fit data-fit-min="0.7">{{home}}</span>
          <span class="sb__score">{{home_score}}</span>
        </div>
        <div class="sb__team sb__team--away">
          <span class="sb__name" data-fit data-fit-min="0.7">{{away}}</span>
          <span class="sb__score">{{away_score}}</span>
        </div>
      </div>
      <div class="sb__game">
        <i class="sb__fill"></i>
        <i class="sb__rule"></i>
        <span class="sb__period">{{period}}</span>
        <span class="sb__time">{{clock}}</span>
      </div>
    </div>
  </div>
</div>
