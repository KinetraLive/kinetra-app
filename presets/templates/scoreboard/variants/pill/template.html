<div class="sb">
  <div class="sb__stage">
    <div class="sb__box">
      <div class="sb__pill"></div>
      <span class="sb__badge sb__badge--home"><span class="sb__init">{{home}}</span></span>
      <span class="sb__name" data-fit data-fit-min="0.7">{{home}}</span>
      <span class="sb__scores"><span class="sb__score">{{home_score}}</span><span class="sb__score">{{away_score}}</span></span>
      <span class="sb__name" data-fit data-fit-min="0.7">{{away}}</span>
      <span class="sb__badge sb__badge--away"><span class="sb__init">{{away}}</span></span>
      <span class="sb__game"><span class="sb__period">{{period}}</span><span class="sb__time">{{clock}}</span></span>
    </div>
  </div>
</div>
