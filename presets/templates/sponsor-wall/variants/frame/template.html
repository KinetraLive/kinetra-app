<div class="sw">
  <div class="sw__area">
    <div class="sw__block">
      <div class="sw__panel">
        <div class="sw__plate"></div>
        <span class="sw__br" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <div class="sw__title" data-fit data-fit-min="0.5">{{title}}</div>
        <div class="sw__grid">
          <div class="sw__tile" data-each="logos" data-limit="24" data-tier="{{.tier}}" data-secs="{{.duration}}">
            <span class="sw__br" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <img class="sw__logo" src="{{.logo}}" alt="{{.name}}">
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
