<div class="cd">
  <div class="cd__bg"></div>
  <div class="cd__stage">
    <div class="cd__block">
      <img class="cd__logo" src="{{logo}}" alt="">
      <div class="cd__tags"><span class="cd__title" data-fit data-fit-min="0.6">{{title}}</span></div>
      <div class="cd__clock"><i class="cd__fill"></i><i class="cd__rule"></i><span class="cd__time">{{countdown}}</span></div>
      <div class="cd__bar"><i class="cd__fill"></i><div class="cd__sub" data-fit data-fit-lines="2" data-fit-min="0.7">{{subtitle}}</div></div>
    </div>
  </div>
</div>
