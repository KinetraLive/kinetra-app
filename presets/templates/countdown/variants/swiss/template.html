<div class="cd">
  <div class="cd__bg"></div>
  <div class="cd__stage">
    <div class="cd__head">
      <i class="cd__sq" aria-hidden="true"></i>
      <div class="cd__title" data-fit data-fit-lines="2" data-fit-min="0.6">{{title}}</div>
      <div class="cd__field"><img class="cd__logo" src="{{logo}}" alt=""></div>
    </div>
    <div class="cd__body">
      <div class="cd__time">{{countdown}}</div>
      <i class="cd__rule" aria-hidden="true"></i>
      <div class="cd__sub" data-fit data-fit-lines="2" data-fit-min="0.7">{{subtitle}}</div>
    </div>
  </div>
</div>
