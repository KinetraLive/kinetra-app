<div class="cd">
  <div class="cd__bg"></div>
  <div class="cd__stage">
    <div class="cd__block">
      <img class="cd__logo" src="{{logo}}" alt="">
      <div class="cd__kicker"><i class="cd__rule" aria-hidden="true"></i><span class="cd__title" data-fit data-fit-min="0.6">{{title}}</span><i class="cd__rule" aria-hidden="true"></i></div>
      <div class="cd__time">{{countdown}}</div>
      <div class="cd__sub" data-fit data-fit-lines="2" data-fit-min="0.7">{{subtitle}}</div>
    </div>
  </div>
</div>
