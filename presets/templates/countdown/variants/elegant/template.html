<div class="cd">
  <div class="cd__bg"></div>
  <div class="cd__stage">
    <div class="cd__block">
      <img class="cd__logo" src="{{logo}}" alt="">
      <div class="cd__line"><i class="cd__rule cd__rule--l"></i><div class="cd__title" data-fit data-fit-lines="2" data-fit-min="0.6">{{title}}</div><i class="cd__rule cd__rule--r"></i></div>
      <div class="cd__time">{{countdown}}</div>
      <div class="cd__sub" data-fit data-fit-lines="2" data-fit-min="0.7">{{subtitle}}</div>
    </div>
  </div>
</div>
