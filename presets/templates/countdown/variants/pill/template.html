<div class="cd">
  <div class="cd__bg"></div>
  <div class="cd__stage">
    <div class="cd__block">
      <span class="cd__chip"><img class="cd__logo" src="{{logo}}" alt=""></span>
      <div class="cd__title" data-fit data-fit-lines="2" data-fit-min="0.6">{{title}}</div>
      <div class="cd__pill"><div class="cd__time">{{countdown}}</div></div>
      <div class="cd__sub" data-fit data-fit-lines="2" data-fit-min="0.7">{{subtitle}}</div>
    </div>
  </div>
</div>
