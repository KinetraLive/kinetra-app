<div class="tk">
  <div class="tk__safe">
    <div class="tk__strap">
      <div class="tk__plate"></div>
      <i class="tk__rule tk__rule--top"></i>
      <i class="tk__rule tk__rule--bottom"></i>
      <div class="tk__label"><span class="tk__ltext">{{label}}</span></div>
      <div class="tk__window">
        <div class="tk__track">
          <div class="tk__run"><span class="tk__item" data-each="items">{{.text}}</span></div>
          <div class="tk__run" aria-hidden="true"><span class="tk__item" data-each="items">{{.text}}</span></div>
        </div>
      </div>
    </div>
  </div>
</div>
