<div class="ft">
  <div class="ft__bg"></div>
  <div class="ft__stage">
    <div class="ft__card">
      <div class="ft__plate"></div>
      <div class="ft__head">
        <span class="ft__chip"><img class="ft__logo" src="{{logo}}" alt=""></span>
        <div class="ft__kicker">{{kicker}}</div>
      </div>
      <div class="ft__title" data-fit data-fit-lines="3" data-fit-min="0.5">{{title}}</div>
      <div class="ft__subtitle" data-fit data-fit-lines="2" data-fit-min="0.7">{{subtitle}}</div>
    </div>
  </div>
</div>
