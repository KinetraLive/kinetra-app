<div class="ft">
  <div class="ft__bg"></div>
  <div class="ft__stage">
    <div class="ft__head">
      <i class="ft__sq" aria-hidden="true"></i>
      <div class="ft__kicker">{{kicker}}</div>
      <div class="ft__field"><img class="ft__logo" src="{{logo}}" alt=""></div>
    </div>
    <div class="ft__body">
      <div class="ft__title" data-fit data-fit-lines="3" data-fit-min="0.5">{{title}}</div>
      <i class="ft__rule" aria-hidden="true"></i>
      <div class="ft__subtitle" data-fit data-fit-lines="2" data-fit-min="0.7">{{subtitle}}</div>
    </div>
  </div>
</div>
