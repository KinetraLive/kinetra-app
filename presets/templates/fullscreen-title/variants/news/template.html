<div class="ft">
  <div class="ft__bg"></div>
  <div class="ft__stage">
    <div class="ft__block">
      <img class="ft__logo" src="{{logo}}" alt="">
      <div class="ft__tags"><span class="ft__kicker">{{kicker}}</span></div>
      <div class="ft__bar ft__bar--title"><i class="ft__fill"></i><div class="ft__title" data-fit data-fit-lines="3" data-fit-min="0.5">{{title}}</div></div>
      <div class="ft__bar ft__bar--sub"><i class="ft__fill"></i><div class="ft__subtitle" data-fit data-fit-lines="2" data-fit-min="0.7">{{subtitle}}</div></div>
    </div>
  </div>
</div>
