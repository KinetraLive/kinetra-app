# Reusable: tests + Windows (NSIS) and macOS (universal) builds of one channel, uploaded as
# workflow artifacts (release-windows, release-macos). Uploads nothing anywhere else.
# docs/RELEASING.md. Secrets reach only the steps that need them, as environment variables.
name: Build

on:
  workflow_call:
    inputs:
      channel: { type: string, required: true } # stable | canary
      version: { type: string, required: true }
      suite: { type: string, required: true } # full | fast

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  NODE_VERSION: "24"
  PNPM_VERSION: "12.8.1"

jobs:
  test:
    name: Tests (${{ inputs.suite }})
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-09 (no releases)
        with: { toolchain: stable, components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { workspaces: "src-tauri -> target", shared-key: tests-windows }
      - run: pnpm install --frozen-lockfile
      - name: Versions agree
        run: pnpm run version:check
      - name: Frontend and renderer build
        run: pnpm build:renderer && pnpm build
      - name: cargo fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: cargo audit
        # Every build: fails on a known vulnerability in Cargo.lock (RustSec advisory database);
        # unmaintained / yanked crates are reported as warnings. Pinned; rust-cache keeps the binary.
        shell: bash
        run: |
          cargo audit --version 2>/dev/null | grep -q "0.22.2" || cargo install cargo-audit --version 0.22.2 --locked --quiet
          cd src-tauri && cargo audit
      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --quiet -- -D warnings
      - name: cargo test
        # ~5 min to compile + ~3 to run; a hung test fails here instead of holding the release.
        timeout-minutes: 20
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --quiet
      - name: pnpm check
        run: pnpm check
      - name: pnpm test
        run: pnpm test
      - name: pnpm test:e2e
        if: inputs.suite == 'full'
        run: pnpm test:e2e

  test-macos:
    name: Tests (macOS)
    # The macOS-only code paths (time zone, machine id) run here. Off until the repository
    # variable MACOS_TESTS is "true" (macOS minutes are free once the repo is public). Like the
    # macOS build, a failure is reported but doesn't stop a Windows release.
    if: vars.MACOS_TESTS == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-09 (no releases)
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { workspaces: "src-tauri -> target", shared-key: tests-macos }
      - run: pnpm install --frozen-lockfile
      - name: Frontend and renderer build
        run: pnpm build:renderer && pnpm build
      - name: cargo test
        timeout-minutes: 30
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --quiet
      - name: pnpm test
        run: pnpm test

  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 90
    # Artifact Signing signs in with OIDC: a federated credential on the "release" environment
    # (main and v* tags only), no client secret. docs/RELEASING.md.
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      HAS_AZURE: ${{ vars.AZURE_TENANT_ID != '' && vars.AZURE_CLIENT_ID != '' && vars.AZURE_SIGNING_ENDPOINT != '' && vars.AZURE_SIGNING_ACCOUNT != '' && vars.AZURE_SIGNING_PROFILE != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-09 (no releases)
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { workspaces: "src-tauri -> target", shared-key: release-windows }
      - run: pnpm install --frozen-lockfile
      - name: Signing status
        shell: bash
        run: |
          if [ "$HAS_UPDATER_KEY" != "true" ]; then echo "::warning::Updater signing skipped: no TAURI_SIGNING_PRIVATE_KEY (no update manifest can be published)"; fi
          if [ "$HAS_AZURE" != "true" ]; then echo "::warning::Windows code signing skipped: no Artifact Signing variables in the release environment (the installer is unsigned; SmartScreen will warn)"; fi
      - name: Artifact Signing client
        if: env.HAS_AZURE == 'true'
        shell: pwsh
        env:
          # Microsoft.ArtifactSigning.Client (the signtool dlib), pinned by version and SHA-256.
          CLIENT_VERSION: "1.0.146"
          CLIENT_SHA256: 7761e5d8f31e54b764da21d33cd8b0a2940e1b05526c7dfcb5e94b0431426f70
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "artifact-signing.zip"
          $dir = Join-Path $env:RUNNER_TEMP "artifact-signing"
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/Microsoft.ArtifactSigning.Client/$env:CLIENT_VERSION" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:CLIENT_SHA256) { Write-Output "::error::Artifact Signing client hash mismatch: $hash"; exit 1 }
          Expand-Archive $zip -DestinationPath $dir -Force
          $dlib = Join-Path $dir "bin\x64\Azure.CodeSigning.Dlib.dll"
          if (-not (Test-Path $dlib)) { Write-Output "::error::No x64 dlib in the Artifact Signing client"; exit 1 }
          # The newest x64 signtool of the installed Windows SDKs.
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          if (-not $signtool) { Write-Output "::error::signtool.exe not found"; exit 1 }
          # Only the Azure CLI credential (from azure/login); nothing probes for a managed identity.
          $metadata = Join-Path $env:RUNNER_TEMP "artifact-signing.json"
          @{
            Endpoint = $env:AZURE_SIGNING_ENDPOINT
            CodeSigningAccountName = $env:AZURE_SIGNING_ACCOUNT
            CertificateProfileName = $env:AZURE_SIGNING_PROFILE
            ExcludeCredentials = @("EnvironmentCredential", "ManagedIdentityCredential", "WorkloadIdentityCredential",
              "SharedTokenCacheCredential", "VisualStudioCredential", "VisualStudioCodeCredential",
              "AzurePowerShellCredential", "AzureDeveloperCliCredential", "InteractiveBrowserCredential")
          } | ConvertTo-Json | Set-Content $metadata -Encoding utf8
          Write-Output "signtool $($signtool.Directory.Parent.Name), Artifact Signing client $env:CLIENT_VERSION"
          "ARTIFACT_SIGNING_SIGNTOOL=$($signtool.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ARTIFACT_SIGNING_DLIB=$dlib" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ARTIFACT_SIGNING_METADATA=$metadata" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build config
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
        run: >
          node .github/scripts/release.mjs config --channel "$CHANNEL" --version "$VERSION"
          --updater "$HAS_UPDATER_KEY" --sign-windows "$HAS_AZURE" --out "$RUNNER_TEMP/ci.conf.json"
      - name: Azure sign-in (OIDC)
        if: env.HAS_AZURE == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Artifact Signing token
        # GitHub's OIDC assertion expires within minutes, the access token after 60–90; taking the
        # code signing token now caches it in the Azure CLI for the signs at the end of the build.
        if: env.HAS_AZURE == 'true'
        shell: bash
        run: az account get-access-token --resource https://codesigning.azure.net --output none
      - name: tauri build
        shell: bash
        env:
          KINETRA_CHANNEL: ${{ inputs.channel }}
          # Remote control ships only once kinetra-cloud's relay is live: set the repository
          # variable KINETRA_REMOTE to 1 then (Settings › Secrets and variables › Actions ›
          # Variables). Unset = 0 = no remote control in the app or its UI.
          KINETRA_REMOTE: ${{ vars.KINETRA_REMOTE || '0' }}
          # Cloud backup ships only once the production API has cloud projects switched on: set
          # the repository variable KINETRA_CLOUD to 1 then (same place). Unset = 0 = no cloud
          # backup in the app or its UI.
          KINETRA_CLOUD: ${{ vars.KINETRA_CLOUD || '0' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Empty secrets are unset, so tools never see an empty key.
          for v in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          # No local build paths in panic locations (scripts/release-rustflags.mjs).
          export CARGO_ENCODED_RUSTFLAGS="$(node scripts/release-rustflags.mjs)"
          pnpm tauri build --ci --bundles nsis --config "$RUNNER_TEMP/ci.conf.json"
      - name: Remote control check (the switch only in builds with KINETRA_REMOTE=1)
        shell: bash
        env:
          KINETRA_REMOTE: ${{ vars.KINETRA_REMOTE || '0' }}
        run: node scripts/check-remote-build.mjs build --remote "$KINETRA_REMOTE"
      - name: Cloud backup check (its UI only in builds with KINETRA_CLOUD=1)
        shell: bash
        env:
          KINETRA_CLOUD: ${{ vars.KINETRA_CLOUD || '0' }}
        run: node scripts/check-cloud-build.mjs build --cloud "$KINETRA_CLOUD"
      - name: Release overrides check (no test overrides in release builds)
        shell: bash
        run: node scripts/check-release-overrides.mjs
      - name: Channel check (no CANARY badge in stable builds)
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
        run: node scripts/check-channel-build.mjs build --channel "$CHANNEL"
      - name: Collect
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
        run: >
          node .github/scripts/release.mjs collect --platform windows --channel "$CHANNEL" --version "$VERSION"
          --bundle-dir src-tauri/target/release/bundle --updater "$HAS_UPDATER_KEY" --out release-out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: release-windows, path: release-out/, retention-days: 7, if-no-files-found: error }

  macos:
    name: macOS universal (optional)
    runs-on: macos-latest
    timeout-minutes: 120
    # Optional (docs/RELEASING.md): a failure here doesn't stop a Windows release.
    continue-on-error: true
    env:
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' }}
      HAS_APPLE_NOTARY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-09 (no releases)
        with: { toolchain: stable, targets: "aarch64-apple-darwin, x86_64-apple-darwin" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { workspaces: "src-tauri -> target", shared-key: release-macos }
      - run: pnpm install --frozen-lockfile
      - name: Signing status
        run: |
          if [ "$HAS_UPDATER_KEY" != "true" ]; then echo "::warning::Updater signing skipped: no TAURI_SIGNING_PRIVATE_KEY"; fi
          if [ "$HAS_APPLE_SIGNING" != "true" ]; then echo "::warning::macOS code signing skipped: no Apple Developer ID secrets (Gatekeeper will block the app)"; fi
          if [ "$HAS_APPLE_SIGNING" = "true" ] && [ "$HAS_APPLE_NOTARY" != "true" ]; then echo "::warning::macOS notarization skipped: no APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID"; fi
      - name: Build config
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
        run: >
          node .github/scripts/release.mjs config --channel "$CHANNEL" --version "$VERSION"
          --updater "$HAS_UPDATER_KEY" --sign-windows false --out "$RUNNER_TEMP/ci.conf.json"
      - name: tauri build
        env:
          KINETRA_CHANNEL: ${{ inputs.channel }}
          # Remote control ships only once kinetra-cloud's relay is live: set the repository
          # variable KINETRA_REMOTE to 1 then (Settings › Secrets and variables › Actions ›
          # Variables). Unset = 0 = no remote control in the app or its UI.
          KINETRA_REMOTE: ${{ vars.KINETRA_REMOTE || '0' }}
          # Cloud backup ships only once the production API has cloud projects switched on: set
          # the repository variable KINETRA_CLOUD to 1 then (same place). Unset = 0 = no cloud
          # backup in the app or its UI.
          KINETRA_CLOUD: ${{ vars.KINETRA_CLOUD || '0' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Signing needs all three certificate values, notarization all three account values;
          # an incomplete set is dropped so tauri builds unsigned instead of failing halfway.
          if [ "$HAS_APPLE_SIGNING" != "true" ]; then unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; fi
          if [ "$HAS_APPLE_SIGNING" != "true" ] || [ "$HAS_APPLE_NOTARY" != "true" ]; then unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; fi
          # No local build paths in panic locations (scripts/release-rustflags.mjs).
          export CARGO_ENCODED_RUSTFLAGS="$(node scripts/release-rustflags.mjs)"
          pnpm tauri build --ci --target universal-apple-darwin --bundles app,dmg --config "$RUNNER_TEMP/ci.conf.json"
      - name: Remote control check (the switch only in builds with KINETRA_REMOTE=1)
        shell: bash
        env:
          KINETRA_REMOTE: ${{ vars.KINETRA_REMOTE || '0' }}
        run: node scripts/check-remote-build.mjs build --remote "$KINETRA_REMOTE"
      - name: Cloud backup check (its UI only in builds with KINETRA_CLOUD=1)
        shell: bash
        env:
          KINETRA_CLOUD: ${{ vars.KINETRA_CLOUD || '0' }}
        run: node scripts/check-cloud-build.mjs build --cloud "$KINETRA_CLOUD"
      - name: Release overrides check (no test overrides in release builds)
        shell: bash
        run: node scripts/check-release-overrides.mjs
      - name: Channel check (no CANARY badge in stable builds)
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
        run: node scripts/check-channel-build.mjs build --channel "$CHANNEL"
      - name: Collect
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
        run: >
          node .github/scripts/release.mjs collect --platform macos --channel "$CHANNEL" --version "$VERSION"
          --bundle-dir src-tauri/target/universal-apple-darwin/release/bundle --updater "$HAS_UPDATER_KEY" --out release-out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: release-macos, path: release-out/, retention-days: 7, if-no-files-found: error }
